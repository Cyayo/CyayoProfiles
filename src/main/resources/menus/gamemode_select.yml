# ==============================================================================
#            CyayoProfiles - GUI: Challenge Gamemodes Selection Menu
# ==============================================================================

title: "<dark_gray>Select Challenge Modes ({selected_count}/{max_modes})"
size: 45

filler_items:
  outer_border:
    material: "BLACK_STAINED_GLASS_PANE"
    custom_model_data: 0
    name: " "
    slots: [0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 37, 38, 39, 41, 42, 43, 44]

  inner_accent:
    material: "GRAY_STAINED_GLASS_PANE"
    custom_model_data: 0
    name: " "
    slots: [10, 11, 12, 13, 14, 15, 16, 19, 22, 25, 28, 32, 33, 34]

custom_items:
  summary_info:
    slots: [4]
    material: "BOOK"
    custom_model_data: 0
    name: "<gold><bold>New Character Summary (Slot #{slot})</bold>"
    lore:
      - "<gray>Selected Class: {class_display}"
      - "<gray>Active Modes: <white>{gamemode_names}"
      - ""
      - "<gray>Total Stacked Bonuses:"
      - "  <green>+{total_class_xp}% Class XP"
      - "  <aqua>+{total_gathering_xp}% Gathering XP"
      - "  <gold>+{total_gathering_luck} Gathering Luck"
      - ""
      - "<yellow>Click any challenge below to toggle it on/off!"

modes:
  ironman:
    slots: [20]
    disabled:
      material: "IRON_BLOCK"
      custom_model_data: 0
      name: "<gray><bold>🛡 Ironman Mode</bold> <dark_gray>[Inactive]"
      lore:
        - "<dark_gray>Solo Self-Found Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Cannot drop/pick up items from other players"
        - "  <red>✖ No Trade, Auction House, /pay, or external chests"
        - "  <yellow>★ Separate Ender Chest & Economy Vault"
        - ""
        - "<yellow>▶ Click to ENABLE Ironman Mode!"
    enabled:
      material: "LIME_CONCRETE"
      custom_model_data: 0
      glow: true
      name: "<green><bold>✔ 🛡 Ironman Mode</bold> <green>[ACTIVE]"
      lore:
        - "<dark_gray>Solo Self-Found Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Cannot drop/pick up items from other players"
        - "  <red>✖ No Trade, Auction House, /pay, or external chests"
        - "  <yellow>★ Separate Ender Chest & Economy Vault"
        - ""
        - "<green>✔ Challenge currently selected!"
        - "<red>▶ Click again to disable."

  hardcore:
    slots: [21]
    disabled:
      material: "SKELETON_SKULL"
      custom_model_data: 0
      name: "<red><bold>💀 Hardcore Mode</bold> <dark_gray>[Inactive]"
      lore:
        - "<dark_gray>Permadeath Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Limited lives (1-3 Lives, configurable)"
        - "  <red>✖ At 0 lives, profile is FALLEN & locked forever!"
        - ""
        - "<gray>Active Bonuses:"
        - "  <green>+15% Class XP & Gathering XP"
        - "  <gold>+5 Gathering Luck & +5 Luck"
        - ""
        - "<yellow>▶ Click to ENABLE Hardcore Mode!"
    enabled:
      material: "WITHER_SKELETON_SKULL"
      custom_model_data: 0
      glow: true
      name: "<green><bold>✔ 💀 Hardcore Mode</bold> <green>[ACTIVE]"
      lore:
        - "<dark_gray>Permadeath Challenge ({hardcore_lives} Lives)"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Chosen Lives Limit: <gold>{hardcore_lives} Lives"
        - "  <red>✖ At 0 lives, profile is FALLEN & locked forever!"
        - ""
        - "<gray>Active Bonuses:"
        - "  <green>+15% Class XP & Gathering XP"
        - "  <gold>+5 Gathering Luck & +5 Luck"
        - ""
        - "<green>✔ Challenge currently selected!"
        - "<red>▶ Click again to disable."

  hunted:
    slots: [23]
    disabled:
      material: "NETHERITE_SWORD"
      custom_model_data: 0
      name: "<dark_red><bold>⚔ Hunted Mode</bold> <dark_gray>[Inactive]"
      lore:
        - "<dark_gray>High Risk PvP Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Any player can attack you outside Safezones!"
        - "  <yellow>★ Can only fight back after being attacked first"
        - "  <red>✖ PvP death can DROP all inventory/armor/weapons!"
        - ""
        - "<gray>Active Bonuses:"
        - "  <green>+50% Class XP & Gathering XP"
        - "  <gold>+15 Gathering Luck, +10% Speed & Double Drop"
        - ""
        - "<yellow>▶ Click to ENABLE Hunted Mode!"
    enabled:
      material: "GOLDEN_SWORD"
      custom_model_data: 0
      glow: true
      name: "<green><bold>✔ ⚔ Hunted Mode</bold> <green>[ACTIVE]"
      lore:
        - "<dark_gray>High Risk PvP Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Any player can attack you outside Safezones!"
        - "  <yellow>★ Can only fight back after being attacked first"
        - "  <red>✖ PvP death can DROP your items!"
        - ""
        - "<gray>Active Bonuses:"
        - "  <green>+50% Class XP & Gathering XP"
        - "  <gold>+15 Gathering Luck, +10% Speed & Double Drop"
        - ""
        - "<green>✔ Challenge currently selected!"
        - "<red>▶ Click again to disable."

  cursed:
    slots: [24]
    disabled:
      material: "CRYING_OBSIDIAN"
      custom_model_data: 0
      name: "<dark_purple><bold>☠ Cursed Mode</bold> <dark_gray>[Inactive]"
      lore:
        - "<dark_gray>Nightmare PvE Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Take 1.5x increased damage from all sources"
        - "  <red>✖ Natural health regeneration disabled (use potions/skills)"
        - ""
        - "<gray>Active Bonuses:"
        - "  <green>+50% Class XP & +35% Gathering XP"
        - "  <gold>+10 Gathering Luck & +10 Luck"
        - ""
        - "<yellow>▶ Click to ENABLE Cursed Mode!"
    enabled:
      material: "PURPLE_CONCRETE"
      custom_model_data: 0
      glow: true
      name: "<green><bold>✔ ☠ Cursed Mode</bold> <green>[ACTIVE]"
      lore:
        - "<dark_gray>Nightmare PvE Challenge"
        - ""
        - "<gray>Rules:"
        - "  <red>✖ Take 1.5x increased damage from all sources"
        - "  <red>✖ Natural health regeneration disabled"
        - ""
        - "<gray>Active Bonuses:"
        - "  <green>+50% Class XP & +35% Gathering XP"
        - "  <gold>+10 Gathering Luck & +10 Luck"
        - ""
        - "<green>✔ Challenge currently selected!"
        - "<red>▶ Click again to disable."

hardcore_lives_controls:
  decrease_lives:
    slots: [29]
    material: "RED_STAINED_GLASS_PANE"
    name: "<red><bold>-1 Hardcore Life</bold>"
    lore:
      - "<gray>Decrease Hardcore lives limit."
      - "<gray>Range: <yellow>{min_lives} - {max_lives} Lives"
  lives_display:
    slots: [30]
    material: "RED_DYE"
    name: "<gold><bold>Hardcore Lives: <red>{hardcore_lives} ❤</bold>"
    lore:
      - "<gray>Character falls permanently upon reaching 0 lives."
  increase_lives:
    slots: [31]
    material: "LIME_STAINED_GLASS_PANE"
    name: "<green><bold>+1 Hardcore Life</bold>"
    lore:
      - "<gray>Increase Hardcore lives limit."
      - "<gray>Range: <yellow>{min_lives} - {max_lives} Lives"

back_button:
  slots: [36]
  material: "ARROW"
  name: "<yellow><bold>« Back to Class Selection</bold>"
  lore:
    - "<gray>Click to choose another class."

confirm_button:
  slots: [40]
  material: "EMERALD_BLOCK"
  name: "<green><bold>✔ START ADVENTURE!</bold>"
  lore:
    - "<gray>Class: {class_display}"
    - "<gray>Modes: <white>{gamemode_names}"
    - ""
    - "<red><bold>WARNING:</bold> <gray>Selected modes are permanently locked"
    - "<gray>to this character in Slot #{slot}!"
    - ""
    - "<yellow>▶ Click to create character & begin!"

fill_empty:
  enabled: true
  material: "BLACK_STAINED_GLASS_PANE"
  name: " "
